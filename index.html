	<script>
		let snap = false;

		const capture = () => {

			const base64 = cav.toDataURL('img/png');
			document.querySelector('#img').src = base64;
		};

		document.querySelector("#formImg").addEventListener('submit', async (e) => {
			e.preventDefault()

			const valueLeftWardrobes = document.querySelector('#wdleft').value
			const valueMiddleWardrobes = document.querySelector('#wdmid').value
			const valueRightWardrobes = document.querySelector('#wdright').value

			// const formData2 = Object.fromEntries(new FormData(e.target))

			const base64Response = await fetch(document.querySelector('#img').src);
			const blob = await base64Response.blob();

			const formData = new FormData();
			formData.append('file', blob,
				`(${valueLeftWardrobes})(${valueMiddleWardrobes})(${valueRightWardrobes}).png`
			);
			console.log(blob);
			const response = await fetch('http://localhost:3001/', {
				method: "POST",
				// headers: {
				// 	'Content-Type': 'multipart/form-data',
				// 	'Content-Length': blob.length,
				// },
				body: formData
			}).then(response => response.json())
				.then(data => console.log(data))

		})

		document.getElementById('btn').addEventListener('click', () => { snap = true; });

		init2D()

		function init2D() {
			// 2d context save code
			var cav = document.querySelector('#ctx2d'),
				ctx = cav.getContext('2d')
			ctx.beginPath();
			ctx.arc(20, 20, 50, 0, Math.PI);
			ctx.stroke();
			ctx.closePath()
			var base64 = cav.toDataURL()
			document.querySelector('#img').src = base64
		}

		const container = document.getElementById('container');

		let renderer, scene, camera, stats;
		let object = new THREE.Object3D(),
			mesh, sprite

		window.addEventListener('load', init);

		function init() {
			// three.js code
			renderer = new THREE.WebGLRenderer({
				antialias: true,
				// preserveDrawingBuffer: true,
			});
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
			// container.appendChild(renderer.domElement);

			scene = new THREE.Scene();

			camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
			camera.position.set(50, 50, 50)

			scene.add(new THREE.AmbientLight(0xdddddd));

			controls = new THREE.OrbitControls(camera, renderer.domElement)

			var mesh = new THREE.Mesh(
				new THREE.PlaneBufferGeometry(50, 50),
				new THREE.ShaderMaterial({
					vertexShader: `
				  void main() {
				  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
				  }
				  `,
					fragmentShader: `
				  void main() {
					  gl_FragColor = vec4(1.0,0.0,0.0,1.0);
				  }
			  `,
				})
			)
			scene.add(mesh)

			scene.add(
				new THREE.Mesh(
					new THREE.BoxBufferGeometry(20, 20, 20),
					new THREE.MeshBasicMaterial({
						color: 0x0000ff
					})
				)
			)


			animate();

		}


		function animate() {
			requestAnimationFrame(animate);

			renderer.render(scene, camera);
			if (snap) {
				capture();
				snap = false;
			}
		}

	</script>
